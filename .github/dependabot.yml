# Dependabot — GitHub Actions only.
# sir has zero external Go/Rust dependencies (by design).
# This config only monitors Action version pins for security updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Delay version PRs so a freshly published (possibly compromised)
    # action release has time to be reported. Security updates are not
    # delayed by cooldown.
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "ci"
